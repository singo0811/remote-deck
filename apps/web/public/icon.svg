<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCEBFF"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- tilted console face: reads as a screen at any size -->
  <g transform="translate(0 4)">
    <path d="M118 176 L394 148 Q410 146 412 162 L420 330 Q422 348 404 350 L128 378 Q110 380 108 362 L100 194 Q98 178 118 176 Z"
          fill="url(#face)"/>
    <path d="M136 302 L386 276" stroke="#0EA5E9" stroke-opacity="0.35" stroke-width="14" stroke-linecap="round"/>
    <path d="M158 336 L352 316" stroke="#0EA5E9" stroke-opacity="0.22" stroke-width="12" stroke-linecap="round"/>
    <circle cx="330" cy="214" r="34" fill="url(#bar)"/>
    <path d="M318 196 L350 214 L318 232 Z" fill="#FFFFFF"/>
  </g>

  <!-- stand -->
  <path d="M226 386 L282 381 L292 424 L216 430 Z" fill="#FFFFFF" fill-opacity="0.92"/>
  <rect x="196" y="424" width="140" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.92"/>
</svg>
