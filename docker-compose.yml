services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    container_name: remote-deck-relay
    restart: unless-stopped
    ports:
      - "9600:9600"
    environment:
      RELAY_PORT: "9600"
      RELAY_HOST: "0.0.0.0"
      # Optional shared secret for private relay deployments:
      # RELAY_SECRET: "change-me"
